<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>RR Global | Official Website</title>

    <meta
      name="description"
      content="RR Global official website. Learn more about RR Global, its business activities, services, and company information."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <link
      rel="canonical"
      href="https://rr-global.vercel.app/"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="RR Global | Official Website"
    />

    <meta
      property="og:description"
      content="Official website of RR Global. Explore company information, business activities, services, and contact details."
    />

    <meta
      property="og:url"
      content="https://rr-global.vercel.app/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="RR Global"
    />

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "RR Global",
        "alternateName": "RR Global Nexusx",
        "url": "https://rr-global.vercel.app/"
      }
    </script>

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "RR Global",
        "alternateName": "RR Global Nexusx",
        "url": "https://rr-global.vercel.app/",
        "logo": "https://rr-global.vercel.app/favicon.svg"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
